<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ServiceNow Editors - IBM Carbon Dark</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'carbon': {
                            'bg': '#161616', 'ui-01': '#262626', 'ui-02': '#393939',
                            'ui-03': '#525252', 'ui-04': '#8d8d8d', 'ui-05': '#f4f4f4',
                            'text-01': '#f4f4f4', 'text-02': '#c6c6c6', 'text-03': '#8d8d8d',
                            'text-04': '#525252', 'link-01': '#78a9ff', 'link-02': '#a6c8ff',
                            'support-01': '#fa4d56', 'support-02': '#42be65',
                            'support-03': '#f1c21b', 'support-04': '#4589ff',
                        }
                    },
                    fontFamily: {
                        'ibm': ['IBM Plex Sans', 'sans-serif'],
                        'ibm-mono': ['IBM Plex Mono', 'monospace'],
                    }
                }
            }
        }
    </script>

    <style>
        * { box-sizing: border-box; }
        body { font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; }

        .drag-drop-area { border: 2px dashed #525252; background: #262626; cursor: pointer; transition: all 110ms; }
        .drag-drop-area:hover { border-color: #78a9ff; background: #2d3748; }
        .drag-drop-area.dragging { border-color: #4589ff; background: #1e3a8a; }

        /* General Editor contenteditable */
        .editor-content img[src^="/sys_attachment.do"] { min-height: 60px; background: repeating-linear-gradient(45deg, #f1f5f9, #f1f5f9 10px, #e2e8f0 10px, #e2e8f0 20px); }
        .editor-content .exception-box { background: #fff3cd; border-left: 4px solid #ff832b; padding: 9px 13px; margin: 9px 0; border-radius: 4px; }
        .editor-content .note-box { background: #e3f2f7; border-left: 4px solid #16697A; padding: 9px 13px; margin: 9px 0; border-radius: 4px; }

        /* WYSIWYG action editor */
        .wysiwyg-action { min-height: 220px; padding: 11px 13px; font-size: 13px; line-height: 1.75; color: #161616; background: #fff; border-radius: 0 0 4px 4px; outline: none; }
        .wysiwyg-action:focus { outline: none; }
        .wysiwyg-action .exception-box { background: #fff3cd; border-left: 4px solid #ff832b; padding: 9px 13px; margin: 9px 0; border-radius: 4px; }
        .wysiwyg-action .exception-box strong { color: #161616; font-weight: 700; }
        .wysiwyg-action .note-box { background: #e3f2f7; border-left: 4px solid #16697A; padding: 9px 13px; margin: 9px 0; border-radius: 4px; }
        .wysiwyg-action .note-box strong { color: #16697A; font-weight: 700; }
        .wysiwyg-action code { font-family: 'SF Mono', Consolas, Monaco, 'Courier New', monospace; font-size: 11.5px; background: #262626; color: #f4f4f4; border-radius: 3px; padding: 1px 5px; font-weight: 600; }
        .wysiwyg-action img { max-width: 100%; height: auto; margin: 8px 0; border: 1px solid #e0e0e0; border-radius: 3px; display: block; }
        .wysiwyg-action ul, .wysiwyg-action ol { margin: 5px 0 5px 18px; padding: 0; }
        .wysiwyg-action li { margin: 3px 0; }
        .wysiwyg-action a { color: #16697A; text-decoration: none; border-bottom: 1px solid #16697A; }

        /* Action editor wrapper */
        .action-editor-wrap { border: 1px solid #525252; border-radius: 4px; transition: border-color 0.15s; }
        .action-editor-wrap:focus-within { border-color: #78a9ff; }

        /* Action toolbar */
        .action-toolbar { background: #1a1a1a; border-bottom: 1px solid #444; padding: 5px 7px; display: flex; flex-wrap: wrap; gap: 3px; align-items: center; position: sticky; top: 0; z-index: 10; box-shadow: 0 2px 6px rgba(0,0,0,0.35); }
        .atb-btn { padding: 4px 8px; border: 1px solid #484848; background: #2c2c2c; color: #e8e8e8; cursor: pointer; border-radius: 3px; font-size: 13px; line-height: 1; display: flex; align-items: center; gap: 3px; min-height: 26px; transition: background 0.1s, border-color 0.1s, color 0.1s; }
        .atb-btn:hover { background: #0f62fe; border-color: #0f62fe; color: #fff; }
        .atb-sep { width: 1px; height: 20px; background: #484848; margin: 0 4px; flex-shrink: 0; }

        /* General editor toolbar */
        .gen-toolbar { background: #1a1a1a; border-bottom: 1px solid #444; padding: 5px 8px; display: flex; flex-wrap: wrap; gap: 3px; align-items: center; }
        .gtb-btn { padding: 4px 8px; border: 1px solid #484848; background: #2c2c2c; color: #e8e8e8; cursor: pointer; border-radius: 3px; font-size: 13px; line-height: 1; display: flex; align-items: center; gap: 3px; min-height: 27px; transition: background 0.1s, border-color 0.1s, color 0.1s; }
        .gtb-btn:hover { background: #0f62fe; border-color: #0f62fe; color: #fff; }
        .gtb-sep { width: 1px; height: 20px; background: #484848; margin: 0 4px; flex-shrink: 0; }

        /* Color palette dropdown */
        .color-palette-drop { position: absolute; top: 100%; left: 0; z-index: 200; background: #262626; border: 1px solid #525252; padding: 6px; display: flex; flex-wrap: wrap; gap: 4px; box-shadow: 0 4px 16px rgba(0,0,0,0.5); border-radius: 4px; min-width: 120px; }
        .color-swatch { width: 20px; height: 20px; border-radius: 3px; border: 2px solid transparent; cursor: pointer; transition: transform 0.1s, border-color 0.1s; }
        .color-swatch:hover { transform: scale(1.15); border-color: #78a9ff; }

        /* Mode badge */
        .mode-badge-wysiwyg { background: #0f62fe22; color: #78a9ff; font-size: 11px; padding: 1px 6px; border-radius: 3px; font-weight: 600; }
        .mode-badge-raw { background: #f1c21b22; color: #f1c21b; font-size: 11px; padding: 1px 6px; border-radius: 3px; font-weight: 600; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useCallback, useEffect, useMemo } = React;

        // ── Constants ────────────────────────────────────────────────────────────────
        const TEXT_COLORS = ['#da1e28','#ff832b','#0f62fe','#42be65','#8a3ffc','#161616','#6e6e6e','#ffffff'];
        const HIGHLIGHT_COLORS = ['#fff3cd','#e3f2f7','#d4edda','#fde8e8','#e8e0f7','#f0f0f0','#fffde7'];

        // CSS matching build_1756_snow.py exactly
        const SNOW_CSS = "*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;font-size:14px;line-height:1.6;margin:0;padding:0;background:#f5f5f5;color:#161616}.hdr{background:linear-gradient(135deg,#16697A,#0D4F5C);color:#fff;padding:32px 20px;text-align:center;box-shadow:0 3px 10px rgba(0,0,0,.2);border-bottom:3px solid #0D4F5C}.hdr h1{margin:0 0 10px;font-size:26px;font-weight:700}.warn{background:#da1e28;color:#fff;padding:9px 18px;border-radius:5px;display:inline-block;font-weight:600;font-size:13px;margin:8px 0 0}.info{max-width:1500px;margin:14px auto;padding:13px 20px;background:#e3f2f7;border-left:4px solid #16697A;border-radius:5px;font-size:13px}.info strong{color:#16697A}.intro{max-width:1500px;margin:12px auto;padding:18px 22px;background:#fff;border-radius:7px;box-shadow:0 1px 5px rgba(0,0,0,.08);border-top:3px solid #16697A}.intro h2{color:#16697A;margin:0 0 12px;font-size:17px;font-weight:600}.intro p,.intro li{font-size:13px;color:#393939;margin:6px 0;line-height:1.65}.intro strong{color:#161616}.intro a{color:#16697A;text-decoration:none;border-bottom:1px solid #16697A}.wf-h{color:#16697A;font-size:14px;margin:14px 0 6px;font-weight:600}.wf-ol{margin:0;padding-left:20px}.wf-ol li{margin:7px 0}.nb{background:#e3f2f7;border-left:4px solid #16697A;padding:10px 15px;margin:10px 0;border-radius:4px;font-size:13px}.eb{background:#fff3cd;border-left:4px solid #ff832b;padding:10px 15px;margin:10px 0;border-radius:4px;font-size:13px}.wrap{max-width:1500px;margin:12px auto;padding:0 20px 40px}.cs{margin-bottom:10px;border:1px solid #16697A;border-radius:7px;background:#fff;overflow:hidden}.cs>summary{cursor:pointer;padding:13px 18px;background:linear-gradient(135deg,#16697A,#0D4F5C);color:#fff;font-size:14px;font-weight:600;list-style:none;user-select:none;display:flex;align-items:center;gap:8px}.cs>summary::-webkit-details-marker{display:none}.cs>summary::before{content:'▶';font-size:10px;opacity:.8}.cs[open]>summary::before{content:'▼'}.cs>summary:hover{opacity:.93}.cc{font-size:11px;opacity:.7;font-weight:400}.cc-wrap{padding:8px}.pi{border:1px solid #e0e0e0;border-radius:5px;margin-bottom:5px;background:#fff;content-visibility:auto;contain-intrinsic-block-size:auto 50px}.pi:hover{border-color:#16697A;box-shadow:0 1px 4px rgba(0,0,0,.08)}.pi[open]{border-color:#16697A}.ps{cursor:pointer;padding:9px 11px;display:grid;grid-template-columns:16px 175px 1fr auto auto;gap:9px;align-items:center;list-style:none;user-select:none}.ps::-webkit-details-marker{display:none}.ps::before{content:'▶';color:#16697A;font-size:10px;text-align:center}.pi[open] .ps::before{content:'▼'}.mc{font-family:'SF Mono',Consolas,Monaco,'Courier New',monospace;font-size:12px;font-weight:700;color:#16697A;letter-spacing:.3px;line-height:1.5}.dc{font-size:12px;color:#525252;line-height:1.4}.sys-lbl{font-size:11px;color:#6e6e6e;background:#f5f5f5;border:1px solid #e0e0e0;border-radius:3px;padding:1px 5px;white-space:nowrap;font-family:'SF Mono',Consolas,Monaco,'Courier New',monospace}.badge-p1{background:#da1e28;color:#fff;padding:3px 8px;border-radius:3px;font-weight:700;font-size:11px;white-space:nowrap}.badge-p2{background:#ff832b;color:#fff;padding:3px 8px;border-radius:3px;font-weight:700;font-size:11px;white-space:nowrap}.badge-p3{background:#f1c21b;color:#161616;padding:3px 8px;border-radius:3px;font-weight:700;font-size:11px;white-space:nowrap}.badge-p4{background:#0f62fe;color:#fff;padding:3px 8px;border-radius:3px;font-weight:700;font-size:11px;white-space:nowrap}.badge-none{background:#e0e0e0;color:#525252;padding:3px 8px;border-radius:3px;font-weight:600;font-size:11px;white-space:nowrap}.pd{padding:12px 14px;border-top:1px solid #e8e8e8;background:#fafafa}.pm{display:grid;grid-template-columns:90px 1fr;gap:4px 10px;margin:0 0 10px;font-size:12px}.pm dt{font-weight:600;color:#16697A;margin:0}.pm dd{margin:0;color:#161616}.ops{background:#fff;border:1px solid #e8e8e8;border-radius:4px;padding:11px 13px;font-size:13px;line-height:1.75;color:#161616}.ops strong,.ops b{font-weight:700;color:#161616}.ops em,.ops i{color:#525252}.ops a{color:#16697A;text-decoration:none;border-bottom:1px solid transparent}.ops a:hover{border-bottom-color:#16697A}.ops br{line-height:1}.ops ul,.ops ol{margin:5px 0 5px 18px;padding:0}.ops li{margin:3px 0}.ops table{border-collapse:collapse;width:100%;margin:8px 0;font-size:12px}.ops table td,.ops table th{border:1px solid #e0e0e0;padding:4px 7px;vertical-align:top}.ops table th{background:#f0f0f0;font-weight:600}.ops img{max-width:100%;height:auto;margin:8px 0;border:1px solid #e0e0e0;border-radius:3px;display:block}.ops code,code{font-family:'SF Mono',Consolas,Monaco,'Courier New',monospace;font-size:11.5px;background:#262626;color:#f4f4f4;border-radius:3px;padding:1px 5px;font-weight:600}.exception-box{background:#fff3cd;border-left:4px solid #ff832b;padding:9px 13px;margin:9px 0;border-radius:4px}.exception-box strong{color:#161616;font-weight:700}.note-box{background:#e3f2f7;border-left:4px solid #16697A;padding:9px 13px;margin:9px 0;border-radius:4px}.note-box strong{color:#16697A;font-weight:700}::-webkit-scrollbar{width:7px;height:7px}::-webkit-scrollbar-track{background:#f5f5f5}::-webkit-scrollbar-thumb{background:#c0c0c0;border-radius:4px}";

        const INTRO_HTML = `<div class="intro">
<h2>Operations Response Time</h2>
<p><strong>Operations must always start working on alerts within 15 minutes.</strong></p>
<p>For alerts without specific procedures:</p>
<div class="eb"><strong>z/VM Systems Exception:</strong> For all z/VM systems, place a P3 ticket to the support team and inform support via Slack.</div>
<p class="wf-h">Workflow Steps</p>
<ol class="wf-ol">
<li><strong>Consult SME/IM:</strong> Identify the possible support team responsible for the issue by consulting the SME/IM and experienced co-workers.</li>
<li><strong>Identify Support Team:</strong> Refer to the INV database (view ITOps Master at <a href="https://ibm.ent.box.com/folder/246732649636" target="_blank">this link</a>) or use the OpsEngine tool.</li>
<li><strong>Out of Hours Escalation:</strong> If you cannot identify the support team and it is out of business hours, engage z/OS Support and open a P1 ticket. Seek their advice to identify the appropriate team and adjust the ticket queue accordingly.</li>
</ol>
<div class="nb"><strong>Important Notes:</strong>
<ul style="margin:6px 0;padding-left:18px">
<li><strong>Business hours:</strong> Contact support teams on Slack for a solution.</li>
<li><strong>Non-business hours:</strong> Send a message to their Slack channel or engage on-call support according to the instructions above.</li>
</ul>
</div>
</div>`;

        // ── Helpers ──────────────────────────────────────────────────────────────────
        const categoryKey = (msgCode) => {
            const m = (msgCode || '').trim();
            if (!m || m === 'N/A') return '·';
            const ch = m[0].toUpperCase();
            return ch.match(/[A-Z]/) ? ch : '★';
        };

        const getCategoryName = (key) => {
            const names = { '★': 'Special Characters  ($  #  @  ···)', '·': 'Other / Uncategorized' };
            return names[key] || `Procedures — ${key}`;
        };

        const badgeClass = (p) => {
            const map = { 'P1': 'badge-p1', 'P2': 'badge-p2', 'P3': 'badge-p3', 'P4': 'badge-p4' };
            return map[(p || '').toUpperCase()] || 'badge-none';
        };

        const badgeLabel = (p) => {
            const map = { 'P1': 'P1', 'P2': 'P2', 'P3': 'P3', 'P4': 'P4' };
            return map[(p || '').toUpperCase()] || '—';
        };

        // ── Icon component ───────────────────────────────────────────────────────────
        // Lucide UMD exports icons as arrays of [tagName, attrs] tuples (e.g. lucide.Undo2).
        // We build the SVG string directly — no createIcons(), no DOM side-effects, React-safe.
        const Icon = ({ name, size = 20, className = "" }) => {
            const pascal = name.split('-').map(p => p.charAt(0).toUpperCase() + p.slice(1)).join('');
            const iconData = lucide[pascal];
            if (!iconData || !Array.isArray(iconData)) return null;

            const renderNodes = (nodes) => nodes.map(([tag, attrs = {}]) => {
                const a = Object.entries(attrs)
                    .map(([k, v]) => `${k.replace(/[A-Z]/g, m => '-' + m.toLowerCase())}="${v}"`)
                    .join(' ');
                return `<${tag} ${a}/>`;
            }).join('');

            const svgHtml = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${renderNodes(iconData)}</svg>`;

            return <span className={className} style={{display:'inline-flex', alignItems:'center', lineHeight:0}} dangerouslySetInnerHTML={{__html: svgHtml}} />;
        };

        // ── ColorPalette component ───────────────────────────────────────────────────
        const ColorPalette = ({ colors, onSelect, title, iconName = "palette" }) => {
            const [open, setOpen] = useState(false);
            const ref = useRef(null);

            useEffect(() => {
                const handler = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
                document.addEventListener('mousedown', handler);
                return () => document.removeEventListener('mousedown', handler);
            }, []);

            return (
                <div ref={ref} style={{ position: 'relative', display: 'inline-flex' }}>
                    <button
                        type="button"
                        title={title}
                        onMouseDown={(e) => { e.preventDefault(); setOpen(o => !o); }}
                        className="atb-btn"
                    >
                        <Icon name={iconName} size={14} />
                        <span style={{ fontSize: 9, lineHeight: 1 }}>▾</span>
                    </button>
                    {open && (
                        <div className="color-palette-drop">
                            {colors.map(c => (
                                <div
                                    key={c}
                                    className="color-swatch"
                                    style={{ background: c, border: c === '#ffffff' ? '2px solid #525252' : '2px solid transparent' }}
                                    title={c}
                                    onMouseDown={(e) => { e.preventDefault(); onSelect(c); setOpen(false); }}
                                />
                            ))}
                        </div>
                    )}
                </div>
            );
        };

        // Variant for General Editor toolbar (uses gtb-btn class)
        const GenColorPalette = ({ colors, onSelect, title, iconName = "palette" }) => {
            const [open, setOpen] = useState(false);
            const ref = useRef(null);

            useEffect(() => {
                const handler = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
                document.addEventListener('mousedown', handler);
                return () => document.removeEventListener('mousedown', handler);
            }, []);

            return (
                <div ref={ref} style={{ position: 'relative', display: 'inline-flex' }}>
                    <button
                        type="button"
                        title={title}
                        onMouseDown={(e) => { e.preventDefault(); setOpen(o => !o); }}
                        className="gtb-btn"
                        style={{ gap: 2 }}
                    >
                        <Icon name={iconName} size={14} />
                        <span style={{ fontSize: 9, lineHeight: 1 }}>▾</span>
                    </button>
                    {open && (
                        <div className="color-palette-drop">
                            {colors.map(c => (
                                <div
                                    key={c}
                                    className="color-swatch"
                                    style={{ background: c, border: c === '#ffffff' ? '2px solid #525252' : '2px solid transparent' }}
                                    title={c}
                                    onMouseDown={(e) => { e.preventDefault(); onSelect(c); setOpen(false); }}
                                />
                            ))}
                        </div>
                    )}
                </div>
            );
        };

        // ── ImportModal component ────────────────────────────────────────────────────
        const ImportModal = ({ onImport, onClose }) => {
            const [text, setText] = useState('');
            const [fileName, setFileName] = useState('');
            const [loading, setLoading] = useState(false);
            const taRef = useRef(null);
            const fileRef = useRef(null);

            useEffect(() => { taRef.current?.focus(); }, []);

            const handleKeyDown = (e) => { if (e.key === 'Escape') onClose(); };

            const handleFile = (e) => {
                const file = e.target.files?.[0];
                if (!file) return;
                setLoading(true);
                setFileName(file.name);
                const reader = new FileReader();
                reader.onload = (ev) => { setText(ev.target.result || ''); setLoading(false); };
                reader.onerror = () => { setLoading(false); };
                reader.readAsText(file, 'UTF-8');
            };

            const detectedCount = (text.match(/class="pi"|class='pi'|class="procedure-item"/g) || []).length;

            return (
                <div
                    className="fixed inset-0 z-50 flex items-center justify-center font-ibm"
                    style={{ background: 'rgba(0,0,0,0.75)' }}
                    onKeyDown={handleKeyDown}
                >
                    <div
                        className="bg-carbon-ui-01 border border-carbon-ui-03 flex flex-col shadow-2xl"
                        style={{ width: '82vw', maxWidth: '960px', maxHeight: '85vh' }}
                    >
                        <div className="flex items-center justify-between px-6 py-4 border-b border-carbon-ui-03">
                            <div>
                                <h3 className="text-lg font-semibold text-carbon-text-01">Import HTML</h3>
                                <p className="text-carbon-text-02 text-sm mt-0.5">
                                    Choose <code className="text-carbon-link-01 font-ibm-mono text-xs">1756.html</code> or a previous export, or paste the HTML below
                                </p>
                            </div>
                            <button onClick={onClose} className="text-carbon-text-03 hover:text-carbon-text-01 p-1">
                                <Icon name="x" size={20} />
                            </button>
                        </div>

                        {/* File picker row */}
                        <div className="flex items-center gap-3 px-6 py-3 border-b border-carbon-ui-03" style={{ background: '#1a1a1a' }}>
                            <label
                                className="flex items-center gap-2 px-4 py-2 text-sm cursor-pointer transition-colors"
                                style={{ background: '#0f62fe', color: '#fff', borderRadius: 3 }}
                            >
                                <Icon name="upload" size={14} />
                                Choose File
                                <input ref={fileRef} type="file" accept=".html,.htm" className="hidden" onChange={handleFile} />
                            </label>
                            <span className="text-carbon-text-02 text-sm font-ibm-mono">
                                {loading ? 'Reading file…' : fileName || 'No file chosen'}
                            </span>
                            {detectedCount > 0 && (
                                <span className="ml-auto text-sm font-ibm-mono" style={{ color: '#42be65' }}>
                                    ✓ {detectedCount.toLocaleString()} procedures detected
                                </span>
                            )}
                        </div>

                        <div className="flex-1 flex flex-col p-4" style={{ minHeight: 0 }}>
                            <textarea
                                ref={taRef}
                                value={text}
                                onChange={(e) => { setText(e.target.value); setFileName(''); }}
                                placeholder="…or paste the raw HTML source here"
                                className="flex-1 bg-carbon-bg text-carbon-text-01 font-ibm-mono text-xs p-4 border border-carbon-ui-03 focus:border-carbon-link-01 focus:outline-none resize-none"
                                style={{ minHeight: '240px' }}
                            />
                        </div>
                        <div className="flex items-center justify-between px-6 py-4 border-t border-carbon-ui-03">
                            <span className="text-carbon-text-03 text-sm font-ibm-mono">
                                {text.length > 0 && `${text.length.toLocaleString()} chars`}
                            </span>
                            <div className="flex gap-3">
                                <button onClick={onClose} className="px-4 py-2 bg-carbon-ui-02 hover:bg-carbon-ui-03 text-carbon-text-01 transition-colors text-sm">
                                    Cancel
                                </button>
                                <button
                                    onClick={() => { if (text.trim()) { onImport(text); onClose(); } }}
                                    disabled={!text.trim() || loading}
                                    className="px-6 py-2 bg-carbon-support-04 hover:bg-blue-600 disabled:bg-carbon-ui-03 disabled:text-carbon-text-04 text-white font-medium transition-colors text-sm"
                                >
                                    Import {detectedCount > 0 ? `${detectedCount.toLocaleString()} Procedures` : 'Procedures'}
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // ==================== HOME SCREEN ====================
        const HomeScreen = ({ onSelectEditor }) => (
            <div className="min-h-screen bg-carbon-bg flex items-center justify-center font-ibm">
                <div className="max-w-5xl w-full px-8 py-12">
                    <div className="text-center mb-12">
                        <h1 className="text-5xl font-semibold text-carbon-text-01 mb-3">ServiceNow KB Editors</h1>
                        <p className="text-lg text-carbon-text-02">IBM Carbon Dark</p>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-12">
                        <div onClick={() => onSelectEditor('GENERAL')} className="bg-carbon-ui-01 border border-carbon-ui-03 p-8 cursor-pointer transition-all duration-200 hover:bg-carbon-ui-02 hover:border-carbon-link-01 group">
                            <div className="text-5xl mb-6">📝</div>
                            <h2 className="text-2xl font-semibold text-carbon-text-01 mb-3 group-hover:text-carbon-link-01 transition-colors">General Editor</h2>
                            <p className="text-carbon-text-02 leading-relaxed mb-6">Clean and edit any ServiceNow KB article HTML. Remove Microsoft Office formatting, use visual editing with persistent toolbar, text colors, and highlights.</p>
                            <div className="inline-flex items-center gap-2 text-carbon-link-01 font-medium">
                                <span>Open General Editor</span>
                                <Icon name="arrow-right" size={18} />
                            </div>
                        </div>
                        <div onClick={() => onSelectEditor('1756')} className="bg-carbon-ui-01 border border-carbon-ui-03 p-8 cursor-pointer transition-all duration-200 hover:bg-carbon-ui-02 hover:border-carbon-link-01 group">
                            <div className="text-5xl mb-6">🖥️</div>
                            <h2 className="text-2xl font-semibold text-carbon-text-01 mb-3 group-hover:text-carbon-link-01 transition-colors">1756 Procedures Editor</h2>
                            <p className="text-carbon-text-02 leading-relaxed mb-6">Specialized editor for IBM Mainframe 1756 operational procedures. Compatible with 1756 Alternative html — import, edit any of 1647 procedures, and export a complete file.</p>
                            <div className="inline-flex items-center gap-2 text-carbon-link-01 font-medium">
                                <span>Open 1756 Editor</span>
                                <Icon name="arrow-right" size={18} />
                            </div>
                        </div>
                    </div>
                    <div className="text-center text-carbon-text-03 text-sm">By Cauê Monteiro</div>
                </div>
            </div>
        );

        // ==================== GENERAL EDITOR ====================
        const GeneralEditor = ({ onBack }) => {
            const [mode, setMode] = useState('IMPORT');
            const [rawHTML, setRawHTML] = useState('');
            const [cleanedHTML, setCleanedHTML] = useState('');
            const [editedHTML, setEditedHTML] = useState('');
            const [originalStats, setOriginalStats] = useState({ chars: 0, tags: 0 });
            const [showPreview, setShowPreview] = useState(false);
            const [notification, setNotification] = useState(null);
            const [hasUnsavedChanges, setHasUnsavedChanges] = useState(false);
            const [showFloatingToolbar, setShowFloatingToolbar] = useState(false);
            const [toolbarPosition, setToolbarPosition] = useState({ x: 0, y: 0 });

            const editorRef = useRef(null);

            const cleanHTML = useCallback((html) => {
                let cleaned = html;
                const decode = (text) => { const ta = document.createElement('textarea'); ta.innerHTML = text; return ta.value; };
                cleaned = decode(cleaned);
                cleaned = cleaned.replace(/\x3c!--\?xml:namespace[^>]*--\x3e/gi, '');
                const isImgOrDiv = (tag) => { const n = tag.slice(1).split(/[\s>]/)[0].toLowerCase(); return n === 'img' || n === 'div'; };
                cleaned = cleaned.replace(/(<[^>]+)class="Mso[^"]*"/gi, (m, tag) => isImgOrDiv(tag) ? m : tag);
                cleaned = cleaned.replace(/(<[^>]+)\s+data-[a-z-]+="[^"]*"/gi, (m, tag) => isImgOrDiv(tag) ? m : tag);
                cleaned = cleaned.replace(/(<(?:span|strong|em|b|i|u)[^>]*)\s+lang="[^"]*"/gi, '$1');
                cleaned = cleaned.replace(/(<[^>]+)style="([^"]*)"/gi, (m, tagStart, styles) => {
                    if (isImgOrDiv(tagStart)) return m;
                    const cs = styles.split(';').filter(s => !s.trim().startsWith('mso-')).join(';');
                    return cs ? `${tagStart}style="${cs}"` : tagStart;
                });
                cleaned = cleaned.replace(/<span[^>]*>\s*<\/span>/gi, '');
                let prev = '';
                while (prev !== cleaned) {
                    prev = cleaned;
                    cleaned = cleaned.replace(/<span([^>]*)>\s*<span([^>]*)>(.*?)<\/span>\s*<\/span>/gi, '<span$2>$3</span>');
                }
                cleaned = cleaned.replace(/\n\s*\n\s*\n/g, '\n\n');
                return cleaned.trim();
            }, []);

            const calcStats = useCallback((html) => ({ chars: html.length, tags: (html.match(/<[^>]+>/g) || []).length }), []);
            const showNotif = useCallback((message, type = 'success') => {
                setNotification({ message, type });
                setTimeout(() => setNotification(null), 3000);
            }, []);

            const handleImport = useCallback(() => {
                if (!rawHTML.trim()) { showNotif('Please paste HTML content first', 'error'); return; }
                const cleaned = cleanHTML(rawHTML);
                setCleanedHTML(cleaned);
                setEditedHTML(cleaned);
                setOriginalStats(calcStats(cleaned));
                setMode('EDIT');
                setHasUnsavedChanges(false);
                showNotif('HTML cleaned and imported successfully');
            }, [rawHTML, cleanHTML, calcStats, showNotif]);

            const handlePasteFromClipboard = useCallback(async () => {
                try { const text = await navigator.clipboard.readText(); setRawHTML(text); showNotif('Pasted from clipboard'); }
                catch { showNotif('Failed to read clipboard', 'error'); }
            }, [showNotif]);

            const handleExport = useCallback(() => {
                if (editorRef.current) { setEditedHTML(editorRef.current.innerHTML); setMode('EXPORT'); setHasUnsavedChanges(false); }
            }, []);

            const handleCopyToClipboard = useCallback(async () => {
                try { await navigator.clipboard.writeText(editedHTML); showNotif('Copied to clipboard!'); }
                catch { showNotif('Failed to copy', 'error'); }
            }, [editedHTML, showNotif]);

            const handleCopyNow = useCallback(async () => {
                const html = editorRef.current?.innerHTML || '';
                try { await navigator.clipboard.writeText(html); showNotif('HTML copied to clipboard!'); }
                catch { showNotif('Failed to copy', 'error'); }
            }, [showNotif]);

            const handleBackToImport = useCallback(() => {
                if (hasUnsavedChanges && !window.confirm('You have unsaved changes. Are you sure?')) return;
                setMode('IMPORT'); setRawHTML(''); setCleanedHTML(''); setEditedHTML(''); setHasUnsavedChanges(false);
            }, [hasUnsavedChanges]);

            const execCmd = useCallback((command, value = null) => {
                document.execCommand(command, false, value);
                editorRef.current?.focus();
                setHasUnsavedChanges(true);
            }, []);

            const handleSelectionChange = useCallback(() => {
                const sel = window.getSelection();
                if (sel && !sel.isCollapsed && editorRef.current?.contains(sel.anchorNode)) {
                    const range = sel.getRangeAt(0);
                    const rect = range.getBoundingClientRect();
                    setToolbarPosition({ x: rect.left + rect.width / 2, y: rect.top - 10 });
                    setShowFloatingToolbar(true);
                } else {
                    setShowFloatingToolbar(false);
                }
            }, []);

            useEffect(() => {
                if (mode === 'EDIT' && editorRef.current) {
                    const handleInput = () => setHasUnsavedChanges(true);
                    editorRef.current.addEventListener('input', handleInput);
                    return () => editorRef.current?.removeEventListener('input', handleInput);
                }
            }, [mode]);

            useEffect(() => {
                if (mode === 'EDIT') {
                    document.addEventListener('selectionchange', handleSelectionChange);
                    return () => document.removeEventListener('selectionchange', handleSelectionChange);
                }
            }, [mode, handleSelectionChange]);

            useEffect(() => { if (mode === 'EDIT' && editorRef.current) editorRef.current.focus(); }, [mode]);

            const currentStats = useMemo(() => mode === 'EXPORT' ? calcStats(editedHTML) : originalStats, [mode, editedHTML, originalStats, calcStats]);
            const statsDiff = useMemo(() => {
                if (mode === 'EXPORT') { const c = calcStats(editedHTML); return { chars: c.chars - originalStats.chars, tags: c.tags - originalStats.tags }; }
                return { chars: 0, tags: 0 };
            }, [mode, editedHTML, originalStats, calcStats]);

            return (
                <div className="h-screen bg-carbon-bg flex flex-col font-ibm overflow-hidden">
                    <header className="bg-carbon-ui-01 border-b border-carbon-ui-03 px-6 py-4">
                        <div className="max-w-7xl mx-auto flex items-center justify-between">
                            <div className="flex items-center gap-4">
                                <button onClick={onBack} className="flex items-center gap-2 px-4 py-2 bg-carbon-ui-02 hover:bg-carbon-ui-03 text-carbon-text-01 transition-colors">
                                    <Icon name="arrow-left" size={18} /><span className="text-sm">Home</span>
                                </button>
                                <div>
                                    <h1 className="text-2xl font-semibold text-carbon-text-01 flex items-center gap-2">
                                        <Icon name="file-code" size={28} />General Editor
                                    </h1>
                                    <p className="text-carbon-text-02 text-sm mt-1">Clean & edit ServiceNow KB articles</p>
                                </div>
                            </div>
                            <div className={`px-3 py-1 text-sm font-medium ${mode === 'IMPORT' ? 'bg-carbon-support-03/20 text-carbon-support-03' : mode === 'EDIT' ? 'bg-carbon-support-04/20 text-carbon-support-04' : 'bg-carbon-support-02/20 text-carbon-support-02'}`}>
                                {mode}
                            </div>
                        </div>
                    </header>

                    <div className="bg-carbon-ui-01 border-b border-carbon-ui-03 px-6 py-3">
                        <details className="max-w-7xl mx-auto">
                            <summary className="cursor-pointer text-carbon-text-01 font-medium flex items-center gap-2 hover:text-carbon-link-01 transition-colors">
                                <span className="text-lg">📖</span><span>How to Use - General Editor</span>
                            </summary>
                            <div className="mt-4 p-4 bg-carbon-ui-02 border-l-4 border-carbon-link-01 text-carbon-text-02 text-sm">
                                <ol className="space-y-3 mb-4">
                                    <li><strong className="text-carbon-text-01">1. Import HTML</strong>
                                        <ul className="ml-4 mt-1 text-xs space-y-1">
                                            <li>• Paste raw HTML from ServiceNow source code view</li>
                                            <li>• Click "Clean & Import" to remove MS Office formatting</li>
                                        </ul>
                                    </li>
                                    <li><strong className="text-carbon-text-01">2. Edit Visually</strong>
                                        <ul className="ml-4 mt-1 text-xs space-y-1">
                                            <li>• Use the persistent toolbar above the editor for all formatting</li>
                                            <li>• Select text to show a quick floating toolbar (Bold, Italic, Link)</li>
                                            <li>• Text Color and Highlight palettes are in the toolbar</li>
                                            <li>• "Copy HTML" in the toolbar copies without going to Export</li>
                                        </ul>
                                    </li>
                                    <li><strong className="text-carbon-text-01">3. Export HTML</strong>
                                        <ul className="ml-4 mt-1 text-xs space-y-1">
                                            <li>• Click "Export HTML" for full stats view, or "Copy HTML" for quick copy</li>
                                            <li>• Paste back into ServiceNow</li>
                                        </ul>
                                    </li>
                                </ol>
                            </div>
                        </details>
                    </div>

                    <main className="flex-1 flex flex-col overflow-hidden">
                        {mode === 'IMPORT' && (
                            <div className="flex-1 flex flex-col p-8 max-w-6xl mx-auto w-full">
                                <div className="mb-6">
                                    <h2 className="text-2xl font-semibold text-carbon-text-01 mb-2">Import HTML</h2>
                                    <p className="text-carbon-text-02">Paste the raw HTML from ServiceNow's source code view</p>
                                </div>
                                <div className="flex-1 flex flex-col bg-carbon-ui-01 p-4">
                                    <div className="flex items-center justify-between mb-3">
                                        <div className="flex items-center gap-2"><Icon name="file-code" /><span className="text-carbon-text-01 font-medium">HTML Input</span></div>
                                        <div className="flex items-center gap-4">
                                            <span className="text-carbon-text-02 text-sm">{rawHTML.length.toLocaleString()} chars</span>
                                            {rawHTML && <button onClick={() => setRawHTML('')} className="text-carbon-text-02 hover:text-carbon-text-01"><Icon name="x" size={18} /></button>}
                                        </div>
                                    </div>
                                    <textarea
                                        value={rawHTML}
                                        onChange={(e) => setRawHTML(e.target.value)}
                                        className="flex-1 bg-carbon-bg text-carbon-text-01 font-ibm-mono text-sm p-4 border border-carbon-ui-03 focus:border-carbon-link-01 focus:outline-none resize-none"
                                        placeholder="Paste your HTML here..."
                                    />
                                    <div className="flex items-center gap-3 mt-4">
                                        <button onClick={handlePasteFromClipboard} className="flex items-center gap-2 px-4 py-2 bg-carbon-ui-02 hover:bg-carbon-ui-03 text-carbon-text-01 transition-colors">
                                            <Icon name="clipboard-paste" size={18} />Paste from Clipboard
                                        </button>
                                        <button onClick={handleImport} disabled={!rawHTML.trim()} className="flex items-center gap-2 px-6 py-2 bg-carbon-support-04 hover:bg-blue-600 disabled:bg-carbon-ui-03 disabled:text-carbon-text-04 text-white font-medium transition-colors">
                                            <Icon name="arrow-right" size={18} />Clean & Import
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {mode === 'EDIT' && (
                            <div className="flex-1 flex flex-col overflow-hidden">
                                {/* Edit header */}
                                <div className="bg-carbon-ui-01 border-b border-carbon-ui-03 px-6 py-3 flex items-center justify-between flex-shrink-0">
                                    <div className="flex items-center gap-4">
                                        <button onClick={handleBackToImport} className="flex items-center gap-2 px-3 py-2 bg-carbon-ui-02 hover:bg-carbon-ui-03 text-carbon-text-01 transition-colors text-sm">
                                            <Icon name="arrow-left" size={16} />Back
                                        </button>
                                        <div className="flex items-center gap-2">
                                            <div className="w-2 h-2 bg-carbon-support-04 rounded-full animate-pulse" />
                                            <span className="text-carbon-text-01 font-medium text-sm">Visual Editor</span>
                                            {hasUnsavedChanges && <span className="text-carbon-text-03 text-xs">(unsaved)</span>}
                                        </div>
                                    </div>
                                    <button onClick={handleExport} className="flex items-center gap-2 px-5 py-2 bg-carbon-support-02 hover:bg-green-700 text-carbon-bg font-medium transition-colors text-sm">
                                        Export HTML<Icon name="arrow-right" size={16} />
                                    </button>
                                </div>

                                {/* Persistent Formatting Toolbar */}
                                <div className="gen-toolbar flex-shrink-0 sticky top-0 z-30">
                                    {/* Undo / Redo */}
                                    <button className="gtb-btn" title="Desfazer (Ctrl+Z)" onMouseDown={(e) => { e.preventDefault(); execCmd('undo'); }}>
                                        <Icon name="undo-2" size={14} />
                                    </button>
                                    <button className="gtb-btn" title="Refazer (Ctrl+Y)" onMouseDown={(e) => { e.preventDefault(); execCmd('redo'); }}>
                                        <Icon name="redo-2" size={14} />
                                    </button>
                                    <div className="gtb-sep" />

                                    {/* Formatação de texto — spans internos carregam o estilo visual, não o botão inteiro */}
                                    <button className="gtb-btn" title="Negrito (Ctrl+B)" onMouseDown={(e) => { e.preventDefault(); execCmd('bold'); }}>
                                        <span style={{ fontWeight: 700 }}>B</span>
                                    </button>
                                    <button className="gtb-btn" title="Itálico (Ctrl+I)" onMouseDown={(e) => { e.preventDefault(); execCmd('italic'); }}>
                                        <span style={{ fontStyle: 'italic' }}>I</span>
                                    </button>
                                    <button className="gtb-btn" title="Sublinhado (Ctrl+U)" onMouseDown={(e) => { e.preventDefault(); execCmd('underline'); }}>
                                        <span style={{ textDecoration: 'underline' }}>U</span>
                                    </button>
                                    <button className="gtb-btn" title="Tachado" onMouseDown={(e) => { e.preventDefault(); execCmd('strikeThrough'); }}>
                                        <span style={{ textDecoration: 'line-through' }}>S</span>
                                    </button>
                                    <div className="gtb-sep" />

                                    {/* Títulos */}
                                    <button className="gtb-btn" title="Título H1" onMouseDown={(e) => { e.preventDefault(); execCmd('formatBlock', 'h1'); }}>
                                        <span style={{ fontWeight: 700, fontSize: 12 }}>H1</span>
                                    </button>
                                    <button className="gtb-btn" title="Título H2" onMouseDown={(e) => { e.preventDefault(); execCmd('formatBlock', 'h2'); }}>
                                        <span style={{ fontWeight: 700, fontSize: 12 }}>H2</span>
                                    </button>
                                    <button className="gtb-btn" title="Título H3" onMouseDown={(e) => { e.preventDefault(); execCmd('formatBlock', 'h3'); }}>
                                        <span style={{ fontWeight: 700, fontSize: 12 }}>H3</span>
                                    </button>
                                    <button className="gtb-btn" title="Parágrafo" onMouseDown={(e) => { e.preventDefault(); execCmd('formatBlock', 'p'); }}>
                                        <span style={{ fontSize: 14 }}>¶</span>
                                    </button>
                                    <div className="gtb-sep" />

                                    {/* Listas */}
                                    <button className="gtb-btn" title="Lista com marcadores" onMouseDown={(e) => { e.preventDefault(); execCmd('insertUnorderedList'); }}>
                                        <Icon name="list" size={15} />
                                    </button>
                                    <button className="gtb-btn" title="Lista numerada" onMouseDown={(e) => { e.preventDefault(); execCmd('insertOrderedList'); }}>
                                        <Icon name="list-ordered" size={15} />
                                    </button>
                                    <div className="gtb-sep" />

                                    {/* Alinhamento */}
                                    <button className="gtb-btn" title="Alinhar à esquerda" onMouseDown={(e) => { e.preventDefault(); execCmd('justifyLeft'); }}>
                                        <Icon name="align-left" size={15} />
                                    </button>
                                    <button className="gtb-btn" title="Centralizar" onMouseDown={(e) => { e.preventDefault(); execCmd('justifyCenter'); }}>
                                        <Icon name="align-center" size={15} />
                                    </button>
                                    <button className="gtb-btn" title="Alinhar à direita" onMouseDown={(e) => { e.preventDefault(); execCmd('justifyRight'); }}>
                                        <Icon name="align-right" size={15} />
                                    </button>
                                    <div className="gtb-sep" />

                                    {/* Cor do texto e highlight */}
                                    <GenColorPalette title="Cor do texto" iconName="type" colors={TEXT_COLORS} onSelect={color => { execCmd('foreColor', color); }} />
                                    <GenColorPalette title="Destaque (highlight)" iconName="highlighter" colors={HIGHLIGHT_COLORS} onSelect={color => { execCmd('hiliteColor', color); }} />
                                    <div className="gtb-sep" />

                                    {/* Inserir */}
                                    <button className="gtb-btn" title="Inserir link" onMouseDown={(e) => { e.preventDefault(); const url = window.prompt('URL do link:'); if (url) execCmd('createLink', url); }}>
                                        <Icon name="link" size={15} />
                                    </button>
                                    <button className="gtb-btn" title="Remover formatação" onMouseDown={(e) => { e.preventDefault(); execCmd('removeFormat'); }}>
                                        <Icon name="remove-formatting" size={15} />
                                    </button>

                                    <div style={{ flex: 1 }} />

                                    {/* Copiar HTML rápido */}
                                    <button
                                        className="gtb-btn"
                                        style={{ gap: 6, paddingLeft: 10, paddingRight: 10 }}
                                        onClick={handleCopyNow}
                                        title="Copiar HTML atual para a área de transferência"
                                    >
                                        <Icon name="clipboard-copy" size={14} />
                                        <span style={{ fontSize: 12 }}>Copiar HTML</span>
                                    </button>
                                </div>

                                <div className="flex-1 overflow-auto bg-carbon-ui-02 p-8">
                                    <div
                                        ref={editorRef}
                                        contentEditable
                                        suppressContentEditableWarning
                                        dangerouslySetInnerHTML={{ __html: cleanedHTML }}
                                        className="max-w-4xl mx-auto bg-white p-12 shadow-2xl min-h-96 focus:outline-none editor-content"
                                        style={{ lineHeight: '1.6', fontSize: '16px', color: '#1e293b' }}
                                    />
                                </div>
                            </div>
                        )}

                        {mode === 'EXPORT' && (
                            <div className="flex-1 flex flex-col p-8 max-w-6xl mx-auto w-full">
                                <div className="mb-6">
                                    <h2 className="text-2xl font-semibold text-carbon-text-01 mb-2">Export HTML</h2>
                                    <p className="text-carbon-text-02">Copy the modified HTML and paste it back into ServiceNow</p>
                                </div>
                                <div className="flex-1 flex flex-col bg-carbon-ui-01 p-4">
                                    <div className="flex items-center justify-between mb-3">
                                        <div className="flex items-center gap-2"><Icon name="file-text" /><span className="text-carbon-text-01 font-medium">HTML Output</span></div>
                                        <div className="flex items-center gap-4 text-sm">
                                            <span className="text-carbon-text-02">{currentStats.chars.toLocaleString()} chars · {currentStats.tags} tags</span>
                                            {(statsDiff.chars !== 0 || statsDiff.tags !== 0) && (
                                                <span className="text-carbon-support-04">({statsDiff.chars > 0 ? '+' : ''}{statsDiff.chars} chars, {statsDiff.tags > 0 ? '+' : ''}{statsDiff.tags} tags)</span>
                                            )}
                                        </div>
                                    </div>
                                    <textarea value={editedHTML} readOnly className="flex-1 bg-carbon-bg text-carbon-text-01 font-ibm-mono text-sm p-4 border border-carbon-ui-03 resize-none" />
                                    <div className="flex items-center justify-between mt-4">
                                        <div className="flex items-center gap-3">
                                            <button onClick={() => setMode('EDIT')} className="flex items-center gap-2 px-4 py-2 bg-carbon-ui-02 hover:bg-carbon-ui-03 text-carbon-text-01 transition-colors">
                                                <Icon name="arrow-left" size={18} />Back to Editor
                                            </button>
                                            <button onClick={() => { if (window.confirm('Start over? All changes will be lost.')) { setMode('IMPORT'); setRawHTML(''); setCleanedHTML(''); setEditedHTML(''); setHasUnsavedChanges(false); } }} className="flex items-center gap-2 px-4 py-2 bg-carbon-ui-02 hover:bg-carbon-ui-03 text-carbon-text-01 transition-colors">
                                                <Icon name="rotate-ccw" size={18} />Start Over
                                            </button>
                                        </div>
                                        <div className="flex items-center gap-3">
                                            <button onClick={() => setShowPreview(!showPreview)} className="flex items-center gap-2 px-4 py-2 bg-carbon-ui-02 hover:bg-carbon-ui-03 text-carbon-text-01 transition-colors">
                                                <Icon name={showPreview ? "eye-off" : "eye"} size={18} />{showPreview ? 'Hide' : 'Show'} Preview
                                            </button>
                                            <button onClick={handleCopyToClipboard} className="flex items-center gap-2 px-6 py-2 bg-carbon-support-02 hover:bg-green-700 text-carbon-bg font-medium transition-colors">
                                                <Icon name="clipboard-copy" size={18} />Copy to Clipboard
                                            </button>
                                        </div>
                                    </div>
                                    {showPreview && (
                                        <div className="mt-4 border-t border-carbon-ui-03 pt-4">
                                            <div className="flex items-center gap-2 mb-3"><Icon name="eye" size={18} /><span className="text-carbon-text-01 font-medium">Preview</span></div>
                                            <div className="bg-white p-8 max-h-96 overflow-auto"><div dangerouslySetInnerHTML={{ __html: editedHTML }} /></div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Floating mini-toolbar (selection only) */}
                    {showFloatingToolbar && mode === 'EDIT' && (
                        <div
                            className="fixed bg-carbon-ui-01 text-carbon-text-01 shadow-2xl p-1.5 flex items-center gap-0.5 z-40 border border-carbon-ui-03"
                            style={{ left: `${toolbarPosition.x}px`, top: `${toolbarPosition.y}px`, transform: 'translate(-50%, -100%)' }}
                        >
                            <button onMouseDown={(e) => { e.preventDefault(); execCmd('bold'); }} className="p-1.5 hover:bg-carbon-ui-02 font-bold text-sm" title="Bold">B</button>
                            <button onMouseDown={(e) => { e.preventDefault(); execCmd('italic'); }} className="p-1.5 hover:bg-carbon-ui-02 italic text-sm" title="Italic">I</button>
                            <button onMouseDown={(e) => { e.preventDefault(); execCmd('underline'); }} className="p-1.5 hover:bg-carbon-ui-02 underline text-sm" title="Underline">U</button>
                            <div className="w-px h-4 bg-carbon-ui-03 mx-0.5" />
                            <button onMouseDown={(e) => { e.preventDefault(); const url = window.prompt('URL:'); if (url) execCmd('createLink', url); }} className="p-1.5 hover:bg-carbon-ui-02" title="Link">
                                <Icon name="link" size={13} />
                            </button>
                            <button onMouseDown={(e) => { e.preventDefault(); execCmd('removeFormat'); }} className="p-1.5 hover:bg-carbon-ui-02" title="Clear format">
                                <Icon name="remove-formatting" size={13} />
                            </button>
                        </div>
                    )}

                    {notification && (
                        <div className={`fixed top-4 right-4 ${notification.type === 'error' ? 'bg-carbon-support-01' : 'bg-carbon-support-02'} text-white px-6 py-3 flex items-center gap-2 z-50 shadow-lg`}>
                            <Icon name={notification.type === 'error' ? 'alert-circle' : 'check'} size={20} />
                            <span>{notification.message}</span>
                        </div>
                    )}
                </div>
            );
        };

        // ==================== 1756 EDITOR ====================
        const Editor1756 = ({ onBack }) => {
            const [procedures, setProcedures] = useState([]);
            const [showForm, setShowForm] = useState(false);
            const [editingProcedure, setEditingProcedure] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');
            const [notification, setNotification] = useState(null);
            const [showImportModal, setShowImportModal] = useState(false);
            const [isImporting, setIsImporting] = useState(false);
            const mainRef = useRef(null);

            const showNotif = (message, type = 'success') => {
                setNotification({ message, type });
                setTimeout(() => setNotification(null), 3500);
            };

            const importFromHTML = useCallback(async (htmlString) => {
                setIsImporting(true);
                await new Promise(r => setTimeout(r, 40));
                try {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(htmlString, 'text/html');

                    // Support both new (.pi) and old (.procedure-item) formats
                    const items = doc.querySelectorAll('.pi, .procedure-item');

                    const imported = Array.from(items).map((item, index) => {
                        const isNew = item.classList.contains('pi');
                        let msgCode = '', desc = '', system = '', priority = 'None', support = '', notes = '', action = '';

                        if (isNew) {
                            msgCode = item.querySelector('.mc')?.textContent?.trim() || '';
                            desc = item.querySelector('.dc')?.innerHTML?.trim() || '';
                            system = item.querySelector('.sys-lbl')?.textContent?.trim() || '';
                            priority = item.querySelector('.badge-p1') ? 'P1'
                                     : item.querySelector('.badge-p2') ? 'P2'
                                     : item.querySelector('.badge-p3') ? 'P3'
                                     : item.querySelector('.badge-p4') ? 'P4' : 'None';
                            const pm = item.querySelector('.pm');
                            if (pm) {
                                const dts = Array.from(pm.querySelectorAll('dt'));
                                const dds = Array.from(pm.querySelectorAll('dd'));
                                dts.forEach((dt, i) => {
                                    const k = dt.textContent.trim().toLowerCase();
                                    const v = dds[i]?.textContent?.trim() || '';
                                    if (k === 'support') support = v;
                                    else if (k === 'notes') notes = v;
                                });
                            }
                            action = item.querySelector('.ops')?.innerHTML?.trim() || '';
                        } else {
                            msgCode = item.querySelector('.msg-code')?.textContent?.trim() || '';
                            desc = item.querySelector('.description')?.innerHTML?.trim() || '';
                            const dds = item.querySelectorAll('.proc-meta dd');
                            system = dds[0]?.textContent?.trim() || '';
                            const pb = item.querySelector('.badge');
                            priority = pb?.classList.contains('p1') ? 'P1' : pb?.classList.contains('p2') ? 'P2' : pb?.classList.contains('p3') ? 'P3' : 'None';
                            support = dds[2]?.textContent?.trim() || '';
                            notes = dds[3]?.textContent?.trim() || '';
                            action = item.querySelector('.ops')?.innerHTML?.replace(/<strong>Action:<\/strong>\s*/, '')?.trim() || '';
                        }

                        return {
                            id: `proc-${Date.now()}-${index}`,
                            msgCode, description: desc, system, priority,
                            supportGroup: support, notes, action,
                            category: categoryKey(msgCode)
                        };
                    });

                    setProcedures(imported);
                    showNotif(`${imported.length} procedures imported! ✓`);
                } catch (err) {
                    showNotif('Import failed: ' + err.message, 'error');
                } finally {
                    setIsImporting(false);
                }
            }, []);

            const exportToHTML = useCallback(() => {
                if (procedures.length === 0) { showNotif('No procedures to export', 'error'); return; }

                // Group by first letter
                const groups = {};
                procedures.forEach(proc => {
                    const key = categoryKey(proc.msgCode);
                    if (!groups[key]) groups[key] = [];
                    groups[key].push(proc);
                });

                const sortedKeys = Object.keys(groups).sort((a, b) => {
                    const rank = k => k.match(/[A-Z]/) ? 0 : k === '★' ? 1 : 2;
                    const r = rank(a) - rank(b);
                    return r !== 0 ? r : a.localeCompare(b);
                });

                const esc = (s) => (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

                const renderProc = (proc) => {
                    const code = esc(proc.msgCode);
                    const desc = proc.description || '';
                    const sys = proc.system || '';
                    const support = proc.supportGroup || '';
                    const notesVal = proc.notes || '';
                    const p = (proc.priority || '').toUpperCase();
                    const action = proc.action || '';

                    let meta = '';
                    if (support) meta += `<dt>Support</dt><dd>${esc(support)}</dd>`;
                    if (notesVal) meta += `<dt>Notes</dt><dd>${esc(notesVal)}</dd>`;

                    const metaBlock = meta ? `<dl class="pm">${meta}</dl>` : '';
                    const opsBlock = action ? `<div class="ops">${action}</div>` : '';
                    const sysSpan = sys ? `<span class="sys-lbl">${esc(sys)}</span>` : '';
                    const bc = badgeClass(p);
                    const bl = badgeLabel(p);

                    return `<details class="pi"><summary class="ps"><span class="mc">${code}</span><span class="dc">${desc}</span>${sysSpan}<span class="${bc}">${bl}</span></summary><div class="pd">${metaBlock}${opsBlock}</div></details>`;
                };

                const catBlocks = sortedKeys.map(key => {
                    const procs = groups[key];
                    const name = getCategoryName(key);
                    return `<details class="cs">\n<summary>${name} <span class="cc">(${procs.length})</span></summary>\n<div class="cc-wrap">${procs.map(renderProc).join('\n')}</div>\n</details>`;
                }).join('\n\n');

                const total = procedures.length;
                const unique = new Set(procedures.map(p => p.msgCode).filter(Boolean)).size;

                const html = `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IBM Mainframe Operational Procedures — 1756</title>
<style>${SNOW_CSS}</style>
</head>
<body>
<div class="hdr">
<h1>IBM Mainframe Operational Procedures</h1>
<span class="warn">WARNING: Operations must respond to any WTOR within 15 minutes!</span>
</div>
<div class="info"><strong>How to find a procedure:</strong> Use Ctrl+F / Cmd+F to search by message code or keyword. Click a section to expand. &nbsp;|&nbsp; <strong>${total}</strong> procedures &nbsp;|&nbsp; <strong>${unique}</strong> unique codes</div>
${INTRO_HTML}
<div class="wrap">
${catBlocks}
</div>
</body>
</html>`;

                navigator.clipboard.writeText(html).then(() => showNotif(`Complete HTML (${procedures.length} procedures) copied to clipboard! ✓`));
            }, [procedures]);

            const addProcedure = (data) => {
                if (editingProcedure) {
                    setProcedures(prev => prev.map(p => p.id === editingProcedure.id ? { ...data, id: p.id, category: categoryKey(data.msgCode) } : p));
                    showNotif('Procedure updated! ✓');
                } else {
                    setProcedures(prev => [...prev, { ...data, id: `proc-${Date.now()}`, category: categoryKey(data.msgCode) }]);
                    showNotif('Procedure added! ✓');
                }
                setShowForm(false);
                setEditingProcedure(null);
            };

            const deleteProcedure = (id) => {
                if (confirm('Delete this procedure?')) {
                    setProcedures(prev => prev.filter(p => p.id !== id));
                    showNotif('Procedure deleted');
                }
            };

            const filteredProcedures = useMemo(() =>
                procedures.filter(proc => !searchTerm ||
                    proc.msgCode.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    proc.description.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    (proc.system || '').toLowerCase().includes(searchTerm.toLowerCase())
                ), [procedures, searchTerm]);

            const SIDEBAR_LIMIT = 150;
            const visibleProcedures = searchTerm ? filteredProcedures : filteredProcedures.slice(0, SIDEBAR_LIMIT);
            const isLimited = !searchTerm && filteredProcedures.length > SIDEBAR_LIMIT;

            const openProcedure = (proc) => {
                setEditingProcedure(proc);
                setShowForm(true);
                requestAnimationFrame(() => mainRef.current?.scrollTo({ top: 0, behavior: 'smooth' }));
            };

            return (
                <div className="flex h-screen bg-carbon-bg font-ibm">
                    {/* Sidebar */}
                    <div className="w-80 bg-carbon-ui-01 border-r border-carbon-ui-03 flex flex-col flex-shrink-0">
                        <div className="p-4 border-b border-carbon-ui-03 bg-carbon-ui-02 flex-shrink-0">
                            <button onClick={onBack} className="w-full flex items-center gap-2 px-4 py-2 bg-carbon-ui-03 hover:bg-carbon-ui-04 text-carbon-text-01 transition-colors mb-4">
                                <Icon name="arrow-left" size={18} />Back to Home
                            </button>
                            <h2 className="text-base font-semibold text-carbon-text-01 mb-3">1756 Procedures Editor</h2>

                            <details className="mb-4">
                                <summary className="cursor-pointer text-carbon-text-02 text-sm font-medium flex items-center gap-2 hover:text-carbon-link-01 transition-colors mb-2">
                                    <span>📖</span><span>How to Use</span>
                                </summary>
                                <div className="mt-2 p-3 bg-carbon-bg border-l-2 border-carbon-link-01 text-carbon-text-02 text-xs space-y-2">
                                    <div><strong className="text-carbon-text-01">1. Import</strong> — Click "Import HTML", paste 1756 html content</div>
                                    <div><strong className="text-carbon-text-01">2. Edit</strong> — Click any procedure in the list to edit</div>
                                    <div><strong className="text-carbon-text-01">3. Add</strong> — "Add Procedure" for new entries</div>
                                    <div><strong className="text-carbon-text-01">4. Export</strong> — Generates complete compatible HTML</div>
                                    <div className="pt-1 border-t border-carbon-ui-03 text-carbon-text-03">
                                        Compatible only with https://ibm.service-now.com/kb_view.do?sysparm_article=KB0030322
                                    </div>
                                </div>
                            </details>

                            <button onClick={() => { setShowForm(true); setEditingProcedure(null); }} className="w-full px-4 py-2.5 bg-carbon-support-04 hover:bg-blue-600 text-white font-medium transition-colors mb-2 text-sm">
                                + Add Procedure
                            </button>
                            <button onClick={() => setShowImportModal(true)} className="w-full px-4 py-2 bg-carbon-ui-03 hover:bg-carbon-ui-04 text-carbon-text-01 transition-colors mb-2 text-sm flex items-center justify-center gap-2">
                                <Icon name="upload" size={15} />Import HTML
                            </button>
                            <button onClick={exportToHTML} className="w-full px-4 py-2 bg-carbon-support-02 hover:bg-green-700 text-carbon-bg font-medium transition-colors text-sm flex items-center justify-center gap-2">
                                <Icon name="download" size={15} />Export HTML
                            </button>
                        </div>

                        <div className="p-3 border-b border-carbon-ui-03 flex-shrink-0">
                            <input
                                type="text"
                                placeholder="Search by code, description, system…"
                                value={searchTerm}
                                onChange={(e) => setSearchTerm(e.target.value)}
                                className="w-full px-3 py-2 bg-carbon-bg text-carbon-text-01 border border-carbon-ui-03 focus:border-carbon-link-01 focus:outline-none text-sm font-ibm"
                            />
                            <div className="mt-1.5 text-xs text-carbon-text-03 font-ibm-mono">
                                {procedures.length.toLocaleString()} total · {filteredProcedures.length.toLocaleString()} shown
                                {isLimited && ` · displaying first ${SIDEBAR_LIMIT}`}
                            </div>
                        </div>

                        <div className="flex-1 overflow-y-auto">
                            {isImporting && (
                                <div className="p-4 text-center text-carbon-text-03 text-sm">
                                    <div className="animate-spin text-2xl mb-2">⏳</div>
                                    Importing procedures…
                                </div>
                            )}
                            {visibleProcedures.map(proc => (
                                <div
                                    key={proc.id}
                                    onClick={() => openProcedure(proc)}
                                    className={`px-3 py-2 border-b border-carbon-ui-02 cursor-pointer transition-colors ${editingProcedure?.id === proc.id ? 'bg-carbon-ui-02 border-l-2 border-l-carbon-link-01' : 'hover:bg-carbon-ui-02'}`}
                                >
                                    <div className="flex items-center gap-2">
                                        <span className="text-xs font-bold text-carbon-link-01 font-ibm-mono">{proc.msgCode || '—'}</span>
                                        {proc.priority && proc.priority !== 'None' && (
                                            <span className={`text-xs px-1.5 py-0 rounded font-bold ${proc.priority === 'P1' ? 'bg-red-900 text-red-300' : proc.priority === 'P2' ? 'bg-orange-900 text-orange-300' : 'bg-yellow-900 text-yellow-300'}`}>
                                                {proc.priority}
                                            </span>
                                        )}
                                    </div>
                                    <div className="text-xs text-carbon-text-03 mt-0.5 truncate">{(proc.description || '').replace(/<[^>]*>/g, '')}</div>
                                </div>
                            ))}
                            {isLimited && (
                                <div className="p-3 text-center text-carbon-text-03 text-xs border-t border-carbon-ui-02">
                                    Showing first {SIDEBAR_LIMIT} of {filteredProcedures.length.toLocaleString()} — type to search
                                </div>
                            )}
                            {!isImporting && procedures.length === 0 && (
                                <div className="p-6 text-center text-carbon-text-03 text-sm">
                                    <div className="text-3xl mb-2">📋</div>
                                    No procedures loaded.<br />Click "Import HTML" or "Add Procedure".
                                </div>
                            )}
                        </div>
                    </div>

                    {/* Main Content */}
                    <div ref={mainRef} className="flex-1 overflow-y-auto p-6">
                        {showForm ? (
                            <ProcedureForm
                                key={editingProcedure?.id || 'new'}
                                procedure={editingProcedure}
                                onSave={addProcedure}
                                onCancel={() => { setShowForm(false); setEditingProcedure(null); }}
                                onDelete={editingProcedure ? () => { deleteProcedure(editingProcedure.id); setShowForm(false); } : null}
                                showNotification={showNotif}
                            />
                        ) : (
                            <div className="text-center py-20 text-carbon-text-03">
                                <div className="text-6xl mb-4">🖥️</div>
                                <h2 className="text-2xl font-semibold text-carbon-text-01 mb-2">1756 Procedures Editor</h2>
                                <p className="text-carbon-text-02 max-w-md mx-auto leading-relaxed">
                                    Click <strong className="text-carbon-text-01">"Import HTML"</strong> to load 1756,
                                    or <strong className="text-carbon-text-01">"Add Procedure"</strong> to create a new one.
                                </p>
                            </div>
                        )}
                    </div>

                    {showImportModal && <ImportModal onImport={importFromHTML} onClose={() => setShowImportModal(false)} />}

                    {notification && (
                        <div className={`fixed top-4 right-4 ${notification.type === 'error' ? 'bg-carbon-support-01' : 'bg-carbon-support-02'} text-white px-6 py-3 flex items-center gap-2 z-50 shadow-lg`}>
                            <Icon name={notification.type === 'error' ? 'alert-circle' : 'check'} size={20} />
                            <span>{notification.message}</span>
                        </div>
                    )}
                </div>
            );
        };

        // ==================== PROCEDURE FORM ====================
        const ProcedureForm = ({ procedure, onSave, onCancel, onDelete, showNotification }) => {
            const [formData, setFormData] = useState(procedure || { msgCode: '', description: '', system: '', priority: 'None', supportGroup: '', notes: '', action: '' });
            const [isDragging, setIsDragging] = useState(false);
            const [actionMode, setActionMode] = useState('wysiwyg'); // 'wysiwyg' | 'raw'

            const actionRef = useRef(null);   // contenteditable
            const textareaRef = useRef(null); // raw textarea
            const fileInputRef = useRef(null);

            // Set contenteditable content on mount and when switching to wysiwyg
            useEffect(() => {
                if (actionMode === 'wysiwyg' && actionRef.current) {
                    actionRef.current.innerHTML = formData.action || '';
                    actionRef.current.focus();
                }
            }, [actionMode]);

            // On initial mount set wysiwyg content
            useEffect(() => {
                if (actionRef.current) {
                    actionRef.current.innerHTML = formData.action || '';
                }
            }, []);

            const toggleActionMode = () => {
                if (actionMode === 'wysiwyg') {
                    // Capture wysiwyg → raw
                    const html = actionRef.current?.innerHTML || '';
                    setFormData(prev => ({ ...prev, action: html }));
                    setActionMode('raw');
                } else {
                    // Capture raw → wysiwyg
                    // formData.action already updated by textarea onChange
                    setActionMode('wysiwyg');
                }
            };

            const handleWysiwygInput = () => {
                if (actionRef.current) {
                    setFormData(prev => ({ ...prev, action: actionRef.current.innerHTML }));
                }
            };
