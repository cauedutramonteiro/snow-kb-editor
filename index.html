            // Wysiwyg toolbar actions
            const execWysiwyg = (cmd, value = null) => {
                document.execCommand(cmd, false, value);
                if (actionRef.current) setFormData(prev => ({ ...prev, action: actionRef.current.innerHTML }));
            };

            const insertInWysiwyg = (html) => {
                document.execCommand('insertHTML', false, html);
                if (actionRef.current) setFormData(prev => ({ ...prev, action: actionRef.current.innerHTML }));
            };

            // Raw textarea cursor insertion
            const insertAtCursor = (text) => {
                const ta = textareaRef.current;
                if (!ta) return;
                const start = ta.selectionStart;
                const end = ta.selectionEnd;
                const val = formData.action || '';
                const newVal = val.substring(0, start) + text + val.substring(end);
                setFormData(prev => ({ ...prev, action: newVal }));
                setTimeout(() => { ta.focus(); ta.setSelectionRange(start + text.length, start + text.length); }, 0);
            };

            // Dispatch to correct mode
            const toolbarExec = (cmd, value = null) => {
                if (actionMode === 'wysiwyg') {
                    if (actionRef.current) { actionRef.current.focus(); }
                    execWysiwyg(cmd, value);
                }
                // RAW mode: some commands need special handling (see insertHtml)
            };

            const toolbarInsertHtml = (html) => {
                if (actionMode === 'wysiwyg') {
                    if (actionRef.current) { actionRef.current.focus(); }
                    insertInWysiwyg(html);
                } else {
                    insertAtCursor(html);
                }
            };

            const toolbarInsertRawOnly = (html) => {
                // For raw mode actions that don't map cleanly to execCommand
                if (actionMode === 'raw') {
                    insertAtCursor(html);
                } else {
                    if (actionRef.current) { actionRef.current.focus(); }
                    insertInWysiwyg(html);
                }
            };

            // Image handling
            const formatBytes = (b) => b < 1024 ? b + ' B' : b < 1048576 ? (b / 1024).toFixed(1) + ' KB' : (b / 1048576).toFixed(1) + ' MB';

            const compressImage = (file) => new Promise((resolve, reject) => {
                if (file.size < 200000) {
                    const reader = new FileReader();
                    reader.onload = e => resolve({ base64: e.target.result, compressed: false, originalSize: file.size, finalSize: file.size });
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                    return;
                }
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let { width, height } = img;
                        const max = 1200;
                        if (width > max || height > max) {
                            if (width > height) { height = Math.round(height * max / width); width = max; }
                            else { width = Math.round(width * max / height); height = max; }
                        }
                        canvas.width = width; canvas.height = height;
                        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                        const fmt = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
                        const b64 = canvas.toDataURL(fmt, fmt === 'image/jpeg' ? 0.85 : 1);
                        resolve({ base64: b64, compressed: true, originalSize: file.size, finalSize: Math.round(b64.length * 0.75) });
                    };
                    img.onerror = () => reject(new Error('Failed to load image'));
                    img.src = e.target.result;
                };
                reader.onerror = () => reject(new Error('Failed to read file'));
                reader.readAsDataURL(file);
            });

            const insertImage = async (file) => {
                try {
                    const result = await compressImage(file);
                    const imgTag = `<img src="${result.base64}" alt="${file.name || 'image'}" style="max-width:100%">`;
                    toolbarInsertRawOnly(imgTag);
                    if (result.compressed) {
                        const r = Math.round((result.originalSize - result.finalSize) / result.originalSize * 100);
                        showNotification(`Image: ${formatBytes(result.originalSize)} → ${formatBytes(result.finalSize)} (${r}% smaller) ✓`);
                    } else {
                        showNotification(`Image inserted (${formatBytes(result.finalSize)}) ✓`);
                    }
                } catch (err) {
                    showNotification('Error processing image: ' + err.message, 'error');
                }
            };

            const handleFileSelect = async (files) => {
                const imgs = Array.from(files).filter(f => f.type.startsWith('image/'));
                if (imgs.length === 0) { showNotification('Please select image files only', 'error'); return; }
                for (const f of imgs) await insertImage(f);
            };

            const handlePaste = async (e) => {
                const imgs = Array.from(e.clipboardData?.items || []).filter(i => i.type.startsWith('image/'));
                if (imgs.length === 0) return;
                e.preventDefault();
                for (const item of imgs) {
                    const file = item.getAsFile();
                    if (file) await insertImage(file);
                }
            };

            const handleWysiwygPaste = async (e) => {
                const imgs = Array.from(e.clipboardData?.items || []).filter(i => i.type.startsWith('image/'));
                if (imgs.length === 0) return; // let browser handle text paste
                e.preventDefault();
                for (const item of imgs) {
                    const file = item.getAsFile();
                    if (file) await insertImage(file);
                }
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                let action = actionMode === 'wysiwyg' && actionRef.current
                    ? actionRef.current.innerHTML
                    : (formData.action || '');
                if (action && !/<br|<p|<div|<ul|<ol/i.test(action)) {
                    action = action.replace(/\n/g, '<br>');
                }
                onSave({ ...formData, action });
            };

            const actionCharCount = formData.action?.length || 0;

            // Keyboard shortcuts in raw textarea
            const handleRawKeyDown = (e) => {
                if ((e.ctrlKey || e.metaKey)) {
                    if (e.key === 'b') { e.preventDefault(); insertAtCursor('<strong></strong>'); }
                    else if (e.key === 'i') { e.preventDefault(); insertAtCursor('<em></em>'); }
                    else if (e.key === 'k') { e.preventDefault(); const url = window.prompt('URL:'); if (url) insertAtCursor(`<a href="${url}" target="_blank"></a>`); }
                }
            };

            return (
                <div className="max-w-4xl mx-auto bg-carbon-ui-01 p-6 border border-carbon-ui-03">
                    <h2 className="text-xl font-semibold text-carbon-text-01 mb-5">
                        {procedure ? 'Edit Procedure' : 'New Procedure'}
                    </h2>

                    <form onSubmit={handleSubmit}>
                        {/* Message Code */}
                        <div className="mb-4">
                            <label className="block font-medium mb-1.5 text-carbon-text-01 text-sm">Message Code *</label>
                            <input type="text" required value={formData.msgCode}
                                onChange={(e) => setFormData(p => ({ ...p, msgCode: e.target.value }))}
                                placeholder="e.g., IOS351I"
                                className="w-full px-4 py-2 bg-carbon-bg text-carbon-text-01 border border-carbon-ui-03 focus:border-carbon-link-01 focus:outline-none font-ibm-mono text-sm"
                            />
                        </div>

                        {/* Description */}
                        <div className="mb-4">
                            <label className="block font-medium mb-1.5 text-carbon-text-01 text-sm">Description *</label>
                            <input type="text" required value={formData.description}
                                onChange={(e) => setFormData(p => ({ ...p, description: e.target.value }))}
                                placeholder="Brief description of the message"
                                className="w-full px-4 py-2 bg-carbon-bg text-carbon-text-01 border border-carbon-ui-03 focus:border-carbon-link-01 focus:outline-none font-ibm text-sm"
                            />
                        </div>

                        {/* System / Priority / Support */}
                        <div className="grid grid-cols-3 gap-4 mb-4">
                            <div>
                                <label className="block font-medium mb-1.5 text-carbon-text-01 text-sm">System</label>
                                <input type="text" value={formData.system}
                                    onChange={(e) => setFormData(p => ({ ...p, system: e.target.value }))}
                                    placeholder="e.g., ALL"
                                    className="w-full px-4 py-2 bg-carbon-bg text-carbon-text-01 border border-carbon-ui-03 focus:border-carbon-link-01 focus:outline-none font-ibm text-sm"
                                />
                            </div>
                            <div>
                                <label className="block font-medium mb-1.5 text-carbon-text-01 text-sm">Priority</label>
                                <select value={formData.priority} onChange={(e) => setFormData(p => ({ ...p, priority: e.target.value }))}
                                    className="w-full px-4 py-2 bg-carbon-bg text-carbon-text-01 border border-carbon-ui-03 focus:border-carbon-link-01 focus:outline-none font-ibm text-sm">
                                    <option value="None">None</option>
                                    <option value="P1">P1 — Critical</option>
                                    <option value="P2">P2 — High</option>
                                    <option value="P3">P3 — Medium</option>
                                    <option value="P4">P4 — Low</option>
                                </select>
                            </div>
                            <div>
                                <label className="block font-medium mb-1.5 text-carbon-text-01 text-sm">Support Group</label>
                                <input type="text" value={formData.supportGroup}
                                    onChange={(e) => setFormData(p => ({ ...p, supportGroup: e.target.value }))}
                                    placeholder="e.g., ZOS"
                                    className="w-full px-4 py-2 bg-carbon-bg text-carbon-text-01 border border-carbon-ui-03 focus:border-carbon-link-01 focus:outline-none font-ibm text-sm"
                                />
                            </div>
                        </div>

                        {/* Notes */}
                        <div className="mb-4">
                            <label className="block font-medium mb-1.5 text-carbon-text-01 text-sm">Notes</label>
                            <input type="text" value={formData.notes}
                                onChange={(e) => setFormData(p => ({ ...p, notes: e.target.value }))}
                                placeholder="Optional notes"
                                className="w-full px-4 py-2 bg-carbon-bg text-carbon-text-01 border border-carbon-ui-03 focus:border-carbon-link-01 focus:outline-none font-ibm text-sm"
                            />
                        </div>

                        {/* Operations Action */}
                        <div className="mb-5">
                            <div className="flex items-center justify-between mb-1.5">
                                <label className="font-medium text-carbon-text-01 text-sm">Operations Action</label>
                                <div className="flex items-center gap-2">
                                    <span className="text-carbon-text-03 text-xs font-ibm-mono">{actionCharCount.toLocaleString()} chars</span>
                                    <button
                                        type="button"
                                        onClick={toggleActionMode}
                                        className="text-xs px-2 py-0.5 border border-carbon-ui-03 hover:border-carbon-link-01 transition-colors"
                                        title="Toggle between WYSIWYG and raw HTML"
                                    >
                                        {actionMode === 'wysiwyg'
                                            ? <span className="mode-badge-wysiwyg">WYSIWYG → RAW</span>
                                            : <span className="mode-badge-raw">RAW → WYSIWYG</span>
                                        }
                                    </button>
                                </div>
                            </div>

                            <div className="action-editor-wrap">
                                {/* Toolbar */}
                                <div className="action-toolbar">
                                    {/* Text group */}
                                    <button type="button" className="atb-btn" title="Negrito"
                                        onMouseDown={(e) => { e.preventDefault(); if (actionMode === 'wysiwyg') { actionRef.current?.focus(); execWysiwyg('bold'); } else insertAtCursor('<strong></strong>'); }}>
                                        <span style={{ fontWeight: 700 }}>B</span>
                                    </button>
                                    <button type="button" className="atb-btn" title="Itálico"
                                        onMouseDown={(e) => { e.preventDefault(); if (actionMode === 'wysiwyg') { actionRef.current?.focus(); execWysiwyg('italic'); } else insertAtCursor('<em></em>'); }}>
                                        <span style={{ fontStyle: 'italic' }}>I</span>
                                    </button>
                                    <button type="button" className="atb-btn" title="Sublinhado"
                                        onMouseDown={(e) => { e.preventDefault(); if (actionMode === 'wysiwyg') { actionRef.current?.focus(); execWysiwyg('underline'); } else insertAtCursor('<u></u>'); }}>
                                        <span style={{ textDecoration: 'underline' }}>U</span>
                                    </button>
                                    <button type="button" className="atb-btn" title="Código inline"
                                        onMouseDown={(e) => { e.preventDefault(); toolbarInsertHtml('<code></code>'); }}>
                                        <span style={{ fontFamily: 'monospace', fontSize: 12 }}>&lt;/&gt;</span>
                                    </button>
                                    <div className="atb-sep" />

                                    {/* Structure group */}
                                    <button type="button" className="atb-btn" title="Bullet list"
                                        onMouseDown={(e) => { e.preventDefault(); if (actionMode === 'wysiwyg') { actionRef.current?.focus(); execWysiwyg('insertUnorderedList'); } else insertAtCursor('<ul>\n<li></li>\n</ul>'); }}>
                                        <Icon name="list" size={14} />
                                    </button>
                                    <button type="button" className="atb-btn" title="Numbered list"
                                        onMouseDown={(e) => { e.preventDefault(); if (actionMode === 'wysiwyg') { actionRef.current?.focus(); execWysiwyg('insertOrderedList'); } else insertAtCursor('<ol>\n<li></li>\n</ol>'); }}>
                                        <Icon name="list-ordered" size={14} />
                                    </button>
                                    <button type="button" className="atb-btn" title="Insert line break (raw only)"
                                        onMouseDown={(e) => { e.preventDefault(); if (actionMode === 'wysiwyg') { actionRef.current?.focus(); execWysiwyg('insertHTML', '<br>'); } else insertAtCursor('<br>'); }}>
                                        <Icon name="corner-down-left" size={14} />
                                    </button>
                                    <button type="button" className="atb-btn" title="Insert link"
                                        onMouseDown={(e) => {
                                            e.preventDefault();
                                            const url = window.prompt('Enter URL:');
                                            if (!url) return;
                                            if (actionMode === 'wysiwyg') { actionRef.current?.focus(); execWysiwyg('createLink', url); }
                                            else insertAtCursor(`<a href="${url}" target="_blank"></a>`);
                                        }}>
                                        <Icon name="link" size={14} />
                                    </button>
                                    <div className="atb-sep" />

                                    {/* Boxes group */}
                                    <button type="button" className="atb-btn" title="Exception box"
                                        style={{ color: '#ff832b' }}
                                        onMouseDown={(e) => { e.preventDefault(); toolbarInsertHtml('<div class="exception-box"><strong>&#9888; Exception:</strong> </div>'); }}>
                                        ⚠️ Exc
                                    </button>
                                    <button type="button" className="atb-btn" title="Note box"
                                        style={{ color: '#42be65' }}
                                        onMouseDown={(e) => { e.preventDefault(); toolbarInsertHtml('<div class="note-box"><strong>&#128221; Note:</strong> </div>'); }}>
                                        📝 Note
                                    </button>
                                    <div className="atb-sep" />

                                    {/* Color palettes */}
                                    <ColorPalette
                                        title="Text Color"
                                        iconName="type"
                                        colors={TEXT_COLORS}
                                        onSelect={color => {
                                            if (actionMode === 'wysiwyg') { actionRef.current?.focus(); execWysiwyg('foreColor', color); }
                                            else insertAtCursor(`<span style="color:${color}"></span>`);
                                        }}
                                    />
                                    <ColorPalette
                                        title="Highlight"
                                        iconName="highlighter"
                                        colors={HIGHLIGHT_COLORS}
                                        onSelect={color => {
                                            if (actionMode === 'wysiwyg') { actionRef.current?.focus(); execWysiwyg('hiliteColor', color); }
                                            else insertAtCursor(`<span style="background:${color};padding:1px 3px;border-radius:2px"></span>`);
                                        }}
                                    />
                                    <div className="atb-sep" />

                                    {/* Image */}
                                    <button type="button" className="atb-btn" title="Insert image"
                                        onMouseDown={(e) => { e.preventDefault(); fileInputRef.current?.click(); }}>
                                        <Icon name="image" size={14} />
                                    </button>
                                </div>

                                {/* WYSIWYG editor */}
                                {actionMode === 'wysiwyg' && (
                                    <div
                                        ref={actionRef}
                                        contentEditable
                                        suppressContentEditableWarning
                                        className="wysiwyg-action"
                                        onInput={handleWysiwygInput}
                                        onPaste={handleWysiwygPaste}
                                        onDrop={(e) => { e.preventDefault(); const files = e.dataTransfer.files; if (files.length) handleFileSelect(files); }}
                                        onDragOver={(e) => e.preventDefault()}
                                        style={{ minHeight: 220 }}
                                    />
                                )}

                                {/* RAW textarea */}
                                {actionMode === 'raw' && (
                                    <textarea
                                        ref={textareaRef}
                                        value={formData.action || ''}
                                        onChange={(e) => setFormData(p => ({ ...p, action: e.target.value }))}
                                        onPaste={handlePaste}
                                        onKeyDown={handleRawKeyDown}
                                        placeholder="Raw HTML... (Ctrl+B bold, Ctrl+I italic, Ctrl+K link, Ctrl+V paste images)"
                                        rows={12}
                                        className="w-full px-4 py-3 bg-carbon-bg text-carbon-text-01 border-0 focus:outline-none font-ibm-mono text-xs resize-vertical"
                                        style={{ minHeight: 220, borderRadius: '0 0 4px 4px' }}
                                    />
                                )}
                            </div>

                            {/* Image file input (hidden) */}
                            <input ref={fileInputRef} type="file" accept="image/*" multiple onChange={(e) => handleFileSelect(e.target.files)} className="hidden" />

                            {/* Image drop area */}
                            <div
                                className={`drag-drop-area ${isDragging ? 'dragging' : ''} p-3 text-center mt-2 cursor-pointer`}
                                style={{ borderRadius: 4 }}
                                onClick={() => fileInputRef.current?.click()}
                                onDrop={(e) => { e.preventDefault(); setIsDragging(false); if (e.dataTransfer.files.length) handleFileSelect(e.dataTransfer.files); }}
                                onDragOver={(e) => { e.preventDefault(); setIsDragging(true); }}
                                onDragLeave={() => setIsDragging(false)}
                            >
                                <span className="text-sm text-carbon-text-03">🖼️ Click, drag & drop, or Ctrl+V to insert images</span>
                            </div>
                        </div>

                        {/* Actions */}
                        <div className="flex gap-3 justify-end mt-2">
                            {onDelete && (
                                <button type="button" onClick={onDelete} className="px-5 py-2 bg-carbon-support-01 hover:bg-red-700 text-white font-medium transition-colors text-sm">
                                    Delete
                                </button>
                            )}
                            <button type="button" onClick={onCancel} className="px-5 py-2 bg-carbon-ui-03 hover:bg-carbon-ui-04 text-carbon-text-01 font-medium transition-colors text-sm">
                                Cancel
                            </button>
                            <button type="submit" className="px-6 py-2 bg-carbon-support-04 hover:bg-blue-600 text-white font-medium transition-colors text-sm">
                                {procedure ? 'Update' : 'Create'} Procedure
                            </button>
                        </div>
                    </form>
                </div>
            );
        };

        // ==================== APP ====================
        const App = () => {
            const [currentView, setCurrentView] = useState('HOME');
            return (
                <>
                    {currentView === 'HOME' && <HomeScreen onSelectEditor={setCurrentView} />}
                    {currentView === 'GENERAL' && <GeneralEditor onBack={() => setCurrentView('HOME')} />}
                    {currentView === '1756' && <Editor1756 onBack={() => setCurrentView('HOME')} />}
                </>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
